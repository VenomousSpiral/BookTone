<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Server</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Audiobook Server</h1>
            <nav>
                <button id="filesTab" class="tab-btn active">Files</button>
                <button id="modelsTab" class="tab-btn">Models</button>
            </nav>
        </header>

        <!-- Files Tab -->
        <div id="filesSection" class="tab-content active">
            <div class="toolbar">
                <input type="file" id="fileUpload" accept=".epub,.txt,.html,.pdf" style="display: none">
                <button onclick="document.getElementById('fileUpload').click()" class="btn btn-primary">
                    📤 Upload Ebook
                </button>
                <button onclick="createDirectory()" class="btn">📁 New Folder</button>
                <button onclick="showCreateTextFileModal()" class="btn">📝 New Text File</button>
            </div>
            
            <div class="breadcrumb" id="breadcrumb"></div>
            
            <div class="search-sort-controls">
                <input type="text" id="fileSearch" class="search-input" placeholder="🔍 Search files..." oninput="filterFiles()">
                <select id="fileSort" class="sort-select" onchange="sortFiles()">
                    <option value="recent">Sort: Recently Played</option>
                    <option value="name">Sort: A-Z</option>
                    <option value="modified">Sort: Recently Modified</option>
                    <option value="added">Sort: Recently Added</option>
                </select>
            </div>
            
            <div class="file-list" id="fileList">
                <div class="loading">Loading files...</div>
            </div>
        </div>

        <!-- Models Tab -->
        <div id="modelsSection" class="tab-content">
            <div class="toolbar">
                <button onclick="showAddModelDialog()" class="btn btn-primary">➕ Add Model</button>
                <button onclick="refreshModels()" class="btn">🔄 Refresh</button>
            </div>
            
            <div class="models-list" id="modelsList">
                <div class="loading">Loading models...</div>
            </div>
        </div>
    </div>

    <!-- Modal for Generate Audiobook -->
    <div id="generateModal" class="modal">
        <div class="modal-content">
            <h2>Generate Audiobook</h2>
            <p style="color: var(--text-secondary); margin-bottom: 15px;" id="generateFilePathDisplay"></p>
            <form id="generateForm">
                <input type="hidden" id="generateFilePath">
                
                <label for="modelSelect">Model:</label>
                <select id="modelSelect" required></select>
                
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect" required></select>
                
                <label for="instructions">Instructions (optional):</label>
                <textarea id="instructions" rows="3" placeholder="e.g., Speak in a cheerful and positive tone."></textarea>
                
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Generate & Open Stream</button>
                    <button type="button" onclick="closeGenerateModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Add Model -->
    <div id="addModelModal" class="modal">
        <div class="modal-content">
            <h2>Add OpenAI Model</h2>
            <form id="addModelForm">
                <label for="modelName">Display Name:</label>
                <input type="text" id="modelName" required placeholder="e.g., My Local TTS Server">
                
                <label for="apiModel">API Model Name:</label>
                <input type="text" id="apiModel" required placeholder="e.g., tts-1">
                
                <label for="voicesList">Voices (comma-separated):</label>
                <input type="text" id="voicesList" required placeholder="e.g., alloy, echo, fable">
                
                <label for="baseUrl">Base URL (optional):</label>
                <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
                
                <label for="apiKey">API Key (optional):</label>
                <input type="password" id="apiKey" placeholder="sk-...">
                
                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Add Model</button>
                    <button type="button" onclick="closeAddModelModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal for Edit Model -->
    <div id="editModelModal" class="modal">
        <div class="modal-content">
            <h2>Edit OpenAI Model</h2>
            <form id="editModelForm">
                <label for="editModelName">Display Name:</label>
                <input type="text" id="editModelName" required placeholder="e.g., My Local TTS Server">

                <label for="editApiModel">API Model Name:</label>
                <input type="text" id="editApiModel" required placeholder="e.g., tts-1">

                <label for="editVoicesList">Voices (comma-separated):</label>
                <input type="text" id="editVoicesList" required placeholder="e.g., alloy, echo, fable">

                <label for="editBaseUrl">Base URL (optional):</label>
                <input type="text" id="editBaseUrl" placeholder="https://api.openai.com/v1">

                <label for="editApiKey">API Key (optional):</label>
                <input type="password" id="editApiKey" placeholder="sk-...">

                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" onclick="closeEditModelModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Move Menu Modal -->
    <div id="moveMenu" class="modal"></div>

    <!-- Modal for Create Text File -->
    <div id="createTextFileModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <h2>📝 New Text File</h2>
            <form id="createTextFileForm">
                <label for="newTextFileName">Filename (e.g., my-notes.txt):</label>
                <input type="text" id="newTextFileName" required placeholder="filename.txt" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px;">

                <label for="newTextFileContent">Content:</label>
                <textarea id="newTextFileContent" rows="15" placeholder="Paste or type your text here..." style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-family: inherit; font-size: inherit; resize: vertical;"></textarea>

                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">Create File</button>
                    <button type="button" onclick="closeCreateTextFileModal()" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/theme-manager.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/file-manager.js"></script>
</body>
</html>
